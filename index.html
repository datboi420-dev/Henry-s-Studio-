<!DOCTYPE html>
<html lang="en" class="h-screen">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Henry's Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* iOS-like smooth scrolling and tap highlight removal */
      html, body {
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
      }
      /* Hide scrollbar for horizontal lists */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
</head>
  <body class="bg-black text-white antialiased h-screen w-screen overflow-hidden select-none">
    <div id="root" class="h-full w-full" style="height: 100vh; width: 100vw;"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
